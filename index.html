*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1e293b 0%,#0f172a 60%);color:#e2e8f0;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:360px;background:#111c33;border:1px solid #1e293b;border-radius:18px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo img{width:46px;height:46px;border-radius:12px}
.logo h1{font-size:19px;color:#fff}.logo h1 b{color:#a5b4fc}.logo p{font-size:12px;color:#94a3b8;margin-top:2px}
label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
.pw{position:relative;margin:6px 0 14px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;background:#0b1325;color:#fff;border:1px solid #334155;border-radius:11px;padding:12px 44px 12px 14px;outline:none}
input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.25)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:#94a3b8;font-size:16px;padding:6px 8px;cursor:pointer}
.rem{text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:9px;font-size:13px;color:#cbd5e1;margin-bottom:18px;cursor:pointer}
.rem input{width:18px;height:18px;accent-color:#6366f1}
button.go{width:100%;font:inherit;font-weight:700;font-size:15px;background:#6366f1;color:#fff;border:0;border-radius:11px;padding:12px;cursor:pointer}
button.go:disabled{opacity:.6;cursor:wait}
.err{color:#fca5a5;font-size:13px;min-height:18px;margin-top:10px;text-align:center}
.foot{font-size:11px;color:#64748b;text-align:center;margin-top:16px;line-height:1.5}

 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));return new TextDecoder().decode(pt)}
function show(html){const go=()=>{document.open();document.write(html);document.close()};if(document.readyState==='complete')setTimeout(go,0);else window.addEventListener('load',()=>setTimeout(go,0),{once:true})}
async function tryStored(){const s=localStorage.getItem(KEY)||sessionStorage.getItem(KEY);if(!s)return false;
 try{const k=await crypto.subtle.importKey('raw',b64(s),'AES-GCM',false,['decrypt']);show(await open(k));return true}catch(e){localStorage.removeItem(KEY);sessionStorage.removeItem(KEY);return false}}
Object.keys(localStorage).filter(k=>k.startsWith('darrenFinanceKey:')&&k!==KEY).forEach(k=>localStorage.removeItem(k));
document.getElementById('eye').onclick=()=>{const p=document.getElementById('p');p.type=p.type==='password'?'text':'password'};
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const go=document.getElementById('go'),err=document.getElementById('err');go.disabled=true;go.textContent='Unlocking…';err.textContent='';
 try{const k=await derive(document.getElementById('p').value);const html=await open(k);const raw=ub64(await crypto.subtle.exportKey('raw',k));
  (document.getElementById('r').checked?localStorage:sessionStorage).setItem(KEY,raw);show(html)}
 catch(x){err.textContent='Wrong password — try again.';go.disabled=false;go.textContent='Unlock';document.getElementById('p').select()}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!window.isSecureContext||!crypto.subtle){document.getElementById('err').textContent='Open this page over HTTPS to unlock.'}
tryStored();
</script></body></html>
